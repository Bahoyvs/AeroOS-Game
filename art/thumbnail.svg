<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    Portal thumbnail source (see docs/GROWTH.md §1.3).

    Built against the two things a 1.6% CTR usually means: the image is read at
    about 250px wide in a grid of other games, and it has under a second to say
    what the game is. So:

      - ONE subject. The Nudge button, glossy and enormous, is the verb of the
        whole game. A screenshot of the full desktop is four windows of detail
        that resolve to grey mush at thumbnail size.
      - High contrast and saturation. Aero cyan on deep navy, with a hot
        orange "+" floater as the single warm accent so the eye lands somewhere.
      - Type that survives downscaling. Two words, heavy weight, huge.
      - The period frame (the error dialog, the taskbar sliver) is set dressing
        at the edges, where losing it to scaling costs nothing.

    Render to PNG with `npm run thumbnail`.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#25c8ff"/>
      <stop offset="0.45" stop-color="#0a6fc4"/>
      <stop offset="1" stop-color="#031a3a"/>
    </linearGradient>

    <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#a9f2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9f2ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.47" stop-color="#d2f2ff"/>
      <stop offset="0.48" stop-color="#7ccfff"/>
      <stop offset="1" stop-color="#e6faff"/>
    </linearGradient>

    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ea"/>
      <stop offset="1" stop-color="#0d5ba6"/>
    </linearGradient>

    <linearGradient id="taskbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa0e6"/>
      <stop offset="0.5" stop-color="#0c5ea9"/>
      <stop offset="1" stop-color="#083f75"/>
    </linearGradient>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020c1c" flood-opacity="0.62"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#bloom)"/>

  <!-- A hint of the desktop it lives on, kept to the edges. -->
  <g opacity="0.5">
    <ellipse cx="1500" cy="980" rx="820" ry="240" fill="#5fe6c0" opacity="0.35"/>
    <ellipse cx="300" cy="1010" rx="620" ry="200" fill="#6ff0d8" opacity="0.25"/>
  </g>

  <!-- Period set dressing: a 2000s error dialog, tilted, behind the subject. -->
  <g transform="translate(96 168) rotate(-7)" filter="url(#drop)">
    <rect width="560" height="300" rx="14" fill="#e8f4ff" stroke="#ffffff" stroke-width="3"/>
    <rect width="560" height="60" rx="14" fill="url(#titlebar)"/>
    <rect y="40" width="560" height="20" fill="#0d5ba6"/>
    <text x="26" y="42" font-family="Verdana, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#ffffff">AeroOS</text>
    <circle cx="492" cy="30" r="18" fill="#e04a2f" stroke="#ffffff" stroke-width="3"/>
    <text x="492" y="40" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffffff">X</text>

    <circle cx="92" cy="150" r="42" fill="#ffcf3d" stroke="#b07b00" stroke-width="4"/>
    <text x="92" y="170" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="60" font-weight="700" fill="#4a3200">!</text>
    <text x="166" y="140" font-family="Verdana, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#0b2c4c">LOW MEMORY</text>
    <text x="166" y="188" font-family="Verdana, DejaVu Sans, sans-serif" font-size="26" fill="#254b6c">Buy more RAM.</text>
    <rect x="360" y="228" width="170" height="52" rx="8" fill="#dceaf7" stroke="#7fa8c9" stroke-width="3"/>
    <text x="445" y="263" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#0b2c4c">OK</text>
  </g>

  <!-- The subject. -->
  <g transform="translate(700 300)" filter="url(#drop)">
    <rect width="900" height="300" rx="40" fill="url(#glass)" stroke="#ffffff" stroke-width="6"/>
    <rect x="26" y="20" width="848" height="118" rx="26" fill="#ffffff" opacity="0.55"/>
    <text x="450" y="200" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif"
          font-size="140" font-weight="700" letter-spacing="14" fill="#04304f">NUDGE</text>
  </g>

  <!-- The one warm accent, and the reason to press it. -->
  <g filter="url(#glow)">
    <text x="1620" y="300" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif"
          font-size="110" font-weight="700" fill="#ffd23d" transform="rotate(-9 1620 300)">+9999</text>
  </g>

  <!-- Two words, huge, readable at 250px wide. -->
  <text x="960" y="760" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif"
        font-size="128" font-weight="700" letter-spacing="4" fill="#ffffff"
        stroke="#02203f" stroke-width="10" paint-order="stroke">BUILD THE BUZZ</text>
  <text x="960" y="852" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif"
        font-size="58" font-weight="700" letter-spacing="10" fill="#8ef0ff"
        stroke="#02203f" stroke-width="7" paint-order="stroke">A 2000s DESKTOP IDLE GAME</text>

  <!-- Taskbar sliver: period signal at almost no cost. -->
  <g transform="translate(0 1000)">
    <rect width="1920" height="80" fill="url(#taskbar)"/>
    <rect width="1920" height="3" fill="#9fe0ff" opacity="0.8"/>
    <rect x="24" y="14" width="200" height="52" rx="26" fill="#2f9d4e"/>
    <circle cx="62" cy="40" r="18" fill="#bff5c9"/>
    <text x="150" y="52" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif"
          font-size="30" font-weight="700" fill="#ffffff">Start</text>
    <text x="1880" y="52" text-anchor="end" font-family="Verdana, DejaVu Sans, sans-serif"
          font-size="30" font-weight="700" fill="#dff4ff">11:34 PM</text>
  </g>
</svg>

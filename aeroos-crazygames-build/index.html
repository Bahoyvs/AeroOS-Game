<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a5ea8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='45%25' stop-color='%237fe4ff'/%3E%3Cstop offset='100%25' stop-color='%231b7fd4'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="AeroOS - The Messenger Era. Build the biggest buddy list on a mid-2000s desktop, then Format C: for better hardware."
    />
    <title>AeroOS — The Messenger Era</title>

    <!--
      CrazyGames portal SDK. Loaded ahead of the module so `CrazyGames.SDK` is on
      the page by the time main.js awaits init(); off-portal the script simply
      404s or reports environment "local", and the game falls back to
      localStorage and its own audio settings.
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script type="module" crossorigin src="./assets/index-EPWVnumv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BSxV_FwX.css">
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot__logo">AeroOS</div>
      <div class="boot__bar"><span></span></div>
      <p class="boot__hint">The Messenger Era</p>
    </div>

    <main id="desktop" class="desktop">
      <!--
        The Buffer Overflow's visual layer (GDD §7). It is inert and empty at
        phase 0 and painted entirely from `data-overflow` on <html>, so the
        crisis costs one attribute write per phase change rather than a render
        pass. First child on purpose: it belongs over the wallpaper and under
        everything the player can actually click.
      -->
      <div id="overflow-static" class="overflow-static" aria-hidden="true"></div>
      <div id="icons" class="desktop__icons" role="list" aria-label="Desktop icons"></div>
      <div id="gadget-slot" class="desktop__gadget"></div>
      <div id="windows" class="desktop__windows"></div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </main>

    <nav id="taskbar" aria-label="Taskbar"></nav>

    <!--
      Desktop anchors (GDD §5): chrome-less windows pinned to the desktop, which
      today means The Hive and nothing else.

      It sits *after* the taskbar on purpose, and that placement is the whole
      accessibility contract. Tab order follows DOM order, so a keyboard user
      walks the ordinary windows, then the Start menu and taskbar, and only then
      reaches the Hive — it is the last thing they meet rather than something
      they have to get past. Putting it inside #windows and forcing the order
      with a positive tabindex would have worked and would have broken the tab
      order of everything else on the page.
    -->
    <div id="anchors" class="desktop__anchors"></div>

    <!--
      Aero ripple filter (Faz 2.1). One definition, reused by every ripple
      `spawnTransient` creates — an SVG filter, not a WebGL context, so it
      costs nothing to have unused and never grows the dependency graph.
    -->
    <svg aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <filter id="aero-ripple" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

  </body>
</html>

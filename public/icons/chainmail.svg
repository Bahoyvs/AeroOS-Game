<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Outlook Express's envelope: a cream card with a blue-grey flap, bevelled
       the way every 2003 mail client drew it. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#e6ddc4"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0fb"/><stop offset="1" stop-color="#8fb9d8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="11" width="42" height="28" rx="2" fill="url(#paper)" stroke="#7d7355" stroke-width="1.5"/>
  <path d="M3.8 12.5 24 27 44.2 12.5" fill="none" stroke="#b8ab86" stroke-width="1.5"/>
  <path d="M3 11h42L24 26Z" fill="url(#flap)" stroke="#4d7ea3" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M3.8 37.5 17 26M44.2 37.5 31 26" fill="none" stroke="#c3b795" stroke-width="1.3"/>
  <!-- The unread badge is the whole app: a counter that will not stop rising. -->
  <circle cx="37" cy="35" r="9" fill="#d1372b" stroke="#8d1f16" stroke-width="1.5"/>
  <path d="M33 31.5h8M33 35h8M33 38.5h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
</svg>

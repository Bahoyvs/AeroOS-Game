<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Geocities: a page under construction, forever, with a visitor counter. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a52"/><stop offset="1" stop-color="#5b2f7a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="5" width="40" height="38" rx="2" fill="url(#sky)" stroke="#1a0f33" stroke-width="1.5"/>
  <rect x="6.5" y="7.5" width="35" height="6" rx="1" fill="#ffd93d"/>
  <path d="M8 12.5h32" stroke="#c9a300" stroke-width="1"/>
  <text x="24" y="12.4" font-family="Comic Sans MS, cursive" font-size="5.4" font-weight="700"
        text-anchor="middle" fill="#8a2be2">MY PAGE</text>

  <path d="M8 27h20M8 30.5h26M8 34h15" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="7" y="36.5" width="20" height="5" rx="0.8" fill="#0b0b0b" stroke="#4ade80" stroke-width="0.9"/>
  <text x="17" y="40.6" font-family="monospace" font-size="4.6" font-weight="700"
